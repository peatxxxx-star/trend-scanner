name: Trend-Probe (Erkundung)
on:
  push:
    branches: [main]
    paths: ["trendprobe_now"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python trendprobe.py
      - run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add runs/trendscan/probe.json runs/trendscan/probe_tm.json.gz runs/trendscan/trifft_daten.json.gz
          git commit -q -m "Trend-Probe" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
