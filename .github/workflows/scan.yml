name: Trend-Scan

on:
  schedule:
    # STÜNDLICH, 04:17–19:17 UTC = 06:17–21:17 deutscher Sommerzeit
    # (10.09.: vorher alle 2 Stunden und nur bis 20:17 — viele Nebenmärkte
    # werden erst kurz vor Anpfiff veröffentlicht; jede spätere Stunde
    # bringt zusätzliche Märkte).
    # Minute 17 statt 0: GitHub startet Cron-Jobs zur vollen Stunde oft mit
    # großer Verspätung (Warteschlange) — schräge Minuten laufen pünktlicher.
    # Hinweis: Im Winter (UTC+1) verschiebt sich das um eine Stunde;
    # bei Bedarf dann auf "17 5-20 * * *" ändern.
    # Ab dem 20-Uhr-Lauf reicht das Prüffenster bis 06:00 früh (Nachtspiele),
    # der 21:17-Lauf ist der letzte des Tages.
    - cron: "17 4-19 * * *"
    # Freitag + Samstag noch einmal später: 20:05 UTC = 22:05 deutscher
    # Sommerzeit (an diesen Tagen bleibt Lucio länger wach).
    # (Winter: "5 21 * * 5,6")
    - cron: "5 20 * * 5,6"
    # Vorwärm-Läufe 21:17/23:17/01:17/03:17 UTC = 23:17, 01:17, 03:17, 05:17
    # deutscher Sommerzeit: laden ab 23:17 die Spiele des NÄCHSTEN Tages
    # Stück für Stück in den Cache (kein Bericht), jeder hört am Stundenlimit
    # auf. So verteilt sich die Last über die Nacht statt auf den 06:17-Lauf.
    # (Winter: "17 22,0,2,4 * * *")
    - cron: "17 21,23,1,3 * * *"
  workflow_dispatch:      # manueller Start über den "Run workflow"-Knopf
    inputs:
      datum:
        description: "nur für backtest: Tag als JJJJ-MM-TT (leer = gestern)"
        type: string
        default: ""
      modus:
        description: "scan = normaler Lauf · nachladen = Historien der Teams von heute/morgen neu laden · inventar = welche Märkte/Daten liefert die API pre-match? · abdeckung = welche Statistik-Felder gibt es je Liga (CSV)? · exoten = Paraden/Einwürfe/Abstöße/Freistöße nachladen · tore = Halbzeit-Tore nachladen · tordiagnose = Ereignis-Verlauf im Rohformat ansehen · schuesse = Schusszahlen von gestern roh ausgeben · backtest = einen vergangenen Tag nachrechnen · handball / basketball / eishockey / volleyball = Erkundung der Sportart (Abdeckung + Historien, Test-Token) · handball-scan = Handball-Signale für die nächsten 3 Tage · eishockey-stats / basketball-stats = Statistikblock für die Spiele der großen Ligen nachladen · basketball-liga = ganze Ligen (NBA, EuroLeague, ACB …) am Stück, letzte 400 Tage, danach gleich die Statistiken"
        type: choice
        default: scan
        options: [scan, nachladen, inventar, abdeckung, exoten, tore, tordiagnose, schuesse, backtest, handball, handball-scan, basketball, eishockey, volleyball, eishockey-stats, basketball-stats, basketball-liga]

concurrency:
  group: trend-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Erkundung neue Sportart
        if: contains(fromJSON('["handball","handball-scan","basketball","eishockey","volleyball","eishockey-stats","basketball-stats","basketball-liga"]'), inputs.modus)
        env:
          # 17.09.: eigener Token für den Test-Tag (Secret BETSAPI_TOKEN_TRIAL);
          # fehlt er, fällt es auf den normalen Fußball-Token zurück.
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN_TRIAL || secrets.BETSAPI_TOKEN }}
          SPORT: ${{ inputs.modus == 'handball-scan' && 'handball' || startsWith(inputs.modus, 'eishockey') && 'eishockey' || startsWith(inputs.modus, 'basketball') && 'basketball' || inputs.modus }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python handball.py ${{ inputs.modus == 'handball-scan' && 'scan' || endsWith(inputs.modus, '-stats') && 'stats' || endsWith(inputs.modus, '-liga') && 'liga' || inputs.datum || '4' }}

      - name: Scan ausführen
        if: ${{ !contains(fromJSON('["handball","handball-scan","basketball","eishockey","volleyball","eishockey-stats","basketball-stats","basketball-liga"]'), inputs.modus) }}
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          BACKFILL: ${{ inputs.modus == 'nachladen' && '1' || '0' }}
          INVENTORY: ${{ inputs.modus == 'inventar' && '1' || '0' }}
          COVERAGE: ${{ inputs.modus == 'abdeckung' && '1' || '0' }}
          EXOTEN: ${{ inputs.modus == 'exoten' && '1' || '0' }}
          TORE: ${{ inputs.modus == 'tore' && '1' || '0' }}
          TOREDIAG: ${{ inputs.modus == 'tordiagnose' && '1' || '0' }}
          SHOTSCHECK: ${{ inputs.modus == 'schuesse' && '1' || '0' }}
          BACKTEST: ${{ inputs.modus == 'backtest' && '1' || '0' }}
          BACKTEST_TAG: ${{ inputs.datum }}
        run: python scan.py

      - name: Cache, Lauf-Gedächtnis und Protokoll sichern
        if: always()
        run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
          git diff --cached --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push
