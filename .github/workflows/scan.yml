name: Trend-Scan

on:
  schedule:
    # STÜNDLICH, 04:17–19:17 UTC = 06:17–21:17 deutscher Sommerzeit
    # (10.09.: vorher alle 2 Stunden und nur bis 20:17 — viele Nebenmärkte
    # werden erst kurz vor Anpfiff veröffentlicht; jede spätere Stunde
    # bringt zusätzliche Märkte).
    # Minute 17 statt 0: GitHub startet Cron-Jobs zur vollen Stunde oft mit
    # großer Verspätung (Warteschlange) — schräge Minuten laufen pünktlicher.
    # Hinweis: Im Winter (UTC+1) verschiebt sich das um eine Stunde;
    # bei Bedarf dann auf "17 5-20 * * *" ändern.
    # Ab dem 20-Uhr-Lauf reicht das Prüffenster bis 06:00 früh (Nachtspiele),
    # der 21:17-Lauf ist der letzte des Tages.
    # 19.09.: Actions-Minuten sind seit dem Pro-Upgrade das knappe Gut (ein
    # Lauf dauert 15–21 min; 25 Läufe/Tag = ~450 min/Tag, 3.000 min/Monat
    # wären nach einer Woche weg). Deshalb (Lucio: "alle 2 reicht"): Ziel-Takt
    # sind zwei Stunden.
    # 22.09.: GitHub lässt geplante Läufe regelmäßig aus (Lucio: "gestern gar
    # kein Abendscan"). Der Zeitplan feuert deshalb STÜNDLICH 06:17–21:17
    # deutscher Zeit; scan.py bricht sofort ab, wenn der letzte echte Lauf
    # weniger als 100 Minuten her ist (MIN_ABSTAND_MIN). Ergebnis: echter
    # Zwei-Stunden-Takt, und eine ausgefallene Stunde wird von der nächsten
    # nachgeholt. Übersprungene Läufe kosten ~15 Sekunden.
    # (Winter: "17 5-20 * * *")
    - cron: "17 4-19 * * *"
    # Letzter Lauf des Tages, 21:17 deutscher Zeit: läuft IMMER (FORCE),
    # egal wie kurz der vorige her ist — der Abendscan darf nie ausfallen.
    # (Winter: "17 20 * * *")
    - cron: "17 19 * * *"
    # Freitag + Samstag noch einmal später: 20:05 UTC = 22:05 deutscher
    # Sommerzeit (an diesen Tagen bleibt Lucio länger wach).
    # (Winter: "5 21 * * 5,6")
    - cron: "5 20 * * 5,6"
    # Vorwärm-Läufe 21:17/23:17/01:17/03:17 UTC = 23:17, 01:17, 03:17, 05:17
    # deutscher Sommerzeit: laden ab 23:17 die Spiele des NÄCHSTEN Tages
    # Stück für Stück in den Cache (kein Bericht), jeder hört am Stundenlimit
    # auf. So verteilt sich die Last über die Nacht statt auf den 06:17-Lauf.
    # (Winter: "17 22,0,2,4 * * *")
    # 19.09.: zwei statt vier Vorwärm-Läufe (23:17 und 03:17 deutscher Zeit).
    # (Winter: "17 22,2 * * *")
    - cron: "17 21,1 * * *"
  # 20.09.: Start per Push auf die Datei "scan_now" (Inhalt egal) — damit
  # ein Lauf auch ohne den "Run workflow"-Knopf ausgelöst werden kann
  # (z.B. von Claude aus, wenn der Zeitplan ausfällt).
  push:
    branches: [main]
    paths: ["scan_now"]
  workflow_dispatch:      # manueller Start über den "Run workflow"-Knopf
    inputs:
      datum:
        description: "nur für backtest: Tag als JJJJ-MM-TT (leer = gestern)"
        type: string
        default: ""
      modus:
        description: "scan = normaler Lauf · nachladen = Historien der Teams von heute/morgen neu laden · inventar = welche Märkte/Daten liefert die API pre-match? · abdeckung = welche Statistik-Felder gibt es je Liga (CSV)? · exoten = Paraden/Einwürfe/Abstöße/Freistöße nachladen · tore = Halbzeit-Tore nachladen · tordiagnose = Ereignis-Verlauf im Rohformat ansehen · schuesse = Schusszahlen von gestern roh ausgeben · backtest = einen vergangenen Tag nachrechnen · handball / basketball / eishockey / volleyball = Erkundung der Sportart (Abdeckung + Historien, Test-Token) · handball-scan / eishockey-scan / basketball-scan = Signale der Sportart für die nächsten 3 Tage (Eishockey: Heim über 2,5 Tore gegen löchrige Gast-Abwehr · Basketball: Serien-Regel auf Punkte/HZ/Q1/3er/Fouls/Freiwürfe/Team-Märkte) · eishockey-stats / basketball-stats = Statistikblock für die Spiele der großen Ligen nachladen · basketball-liga = ganze Ligen (NBA, EuroLeague, ACB …) am Stück, letzte 400 Tage, danach gleich die Statistiken · quoten-probe = 1xBet-Quoten-API erkunden (Rohdaten nach runs/)"
        type: choice
        default: scan
        options: [scan, nachladen, inventar, abdeckung, exoten, tore, tordiagnose, schuesse, backtest, handball, handball-scan, basketball, basketball-scan, eishockey, eishockey-scan, eishockey-regel, volleyball, eishockey-stats, basketball-stats, basketball-liga, quoten-probe]

# 21.09.: Sperre "nur ein Lauf gleichzeitig" ENTFERNT. GitHub hält bei
# concurrency nur EINEN wartenden Lauf — kommt ein dritter dazu, wird der
# wartende stillschweigend abgebrochen. Genau so sind geplante Läufe
# verschwunden, wenn nebenher ein Lauf von Hand angestoßen wurde. Der
# Commit-Schritt ist seit 17.09. konfliktfest (rebase -X theirs, 4 Anläufe),
# parallele Läufe sind damit unkritisch.

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 19.09.: 300 -> 45. Ein hängender Lauf hat sonst 5 Stunden Minuten
    # verbrannt; ein normaler Lauf braucht 15–21 min. Manuelle Nachlade-Modi
    # (nachladen, exoten, tore, basketball-liga …) bekommen 180 min.
    timeout-minutes: ${{ inputs.modus != '' && inputs.modus != 'scan' && 180 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Erkundung neue Sportart
        if: contains(fromJSON('["handball","handball-scan","basketball","basketball-scan","eishockey","eishockey-scan","eishockey-regel","volleyball","eishockey-stats","basketball-stats","basketball-liga","quoten-probe"]'), inputs.modus)
        env:
          # 17.09.: eigener Token für den Test-Tag (Secret BETSAPI_TOKEN_TRIAL);
          # fehlt er, fällt es auf den normalen Fußball-Token zurück.
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN_TRIAL || secrets.BETSAPI_TOKEN }}
          BETSAPI_TOKEN_B365: ${{ secrets.BETSAPI_TOKEN_B365 || secrets.BETSAPI_TOKEN_TRIAL || secrets.BETSAPI_TOKEN }}
          SPORT: ${{ inputs.modus == 'handball-scan' && 'handball' || inputs.modus == 'quoten-probe' && 'handball' || startsWith(inputs.modus, 'eishockey') && 'eishockey' || startsWith(inputs.modus, 'basketball') && 'basketball' || inputs.modus }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python handball.py ${{ inputs.modus == 'quoten-probe' && 'quoten' || inputs.modus == 'eishockey-regel' && 'regel' || endsWith(inputs.modus, '-scan') && 'scan' || endsWith(inputs.modus, '-stats') && 'stats' || endsWith(inputs.modus, '-liga') && 'liga' || inputs.datum || '4' }} ${{ inputs.modus == 'eishockey-regel' && inputs.datum || '' }}

      - name: Scan ausführen
        if: ${{ !contains(fromJSON('["handball","handball-scan","basketball","basketball-scan","eishockey","eishockey-scan","eishockey-regel","volleyball","eishockey-stats","basketball-stats","basketball-liga","quoten-probe"]'), inputs.modus) }}
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          # 17.09.: bet365-Katalog (Quotenvergleich) — liegt das Paket auf einem
          # anderen Konto, dessen Token als Secret BETSAPI_TOKEN_B365 eintragen;
          # sonst wird der Test-Token bzw. der Fußball-Token genommen.
          BETSAPI_TOKEN_B365: ${{ secrets.BETSAPI_TOKEN_B365 || secrets.BETSAPI_TOKEN_TRIAL || secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          BACKFILL: ${{ inputs.modus == 'nachladen' && '1' || '0' }}
          INVENTORY: ${{ inputs.modus == 'inventar' && '1' || '0' }}
          COVERAGE: ${{ inputs.modus == 'abdeckung' && '1' || '0' }}
          EXOTEN: ${{ inputs.modus == 'exoten' && '1' || '0' }}
          TORE: ${{ inputs.modus == 'tore' && '1' || '0' }}
          TOREDIAG: ${{ inputs.modus == 'tordiagnose' && '1' || '0' }}
          SHOTSCHECK: ${{ inputs.modus == 'schuesse' && '1' || '0' }}
          BACKTEST: ${{ inputs.modus == 'backtest' && '1' || '0' }}
          BACKTEST_TAG: ${{ inputs.datum }}
          # FORCE=1 = Mindestabstand ignorieren: beim letzten Lauf des Tages
          # (21:17 deutscher Zeit) und bei jedem Start von Hand / per scan_now.
          FORCE: ${{ (github.event_name != 'schedule' || github.event.schedule == '17 19 * * *') && '1' || '0' }}
        run: python scan.py

      - name: Cache, Lauf-Gedächtnis und Protokoll sichern
        if: always()
        # 17.09.: Zwei Läufe, die dieselbe Tagesdatei schreiben (z.B. zweimal
        # handball-scan), liefen beim "pull --rebase" in einen Konflikt, der
        # Rebase blieb halb fertig stehen ("not currently on a branch"), der
        # Push scheiterte — Ergebnis war da, wurde aber nicht gesichert.
        # Jetzt: bei Konflikten gewinnt die Fassung DIESES Laufs für die
        # Dateien, die er geschrieben hat; alles andere kommt von origin.
        # Dazu bis zu vier Anläufe, falls parallel ein anderer Lauf pusht.
        run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          MSG="Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git commit -q -m "$MSG"
          for i in 1 2 3 4; do
            OURS=$(git rev-parse HEAD)
            git fetch -q origin main
            if ! git rebase -q -X theirs origin/main; then
              git rebase --abort || true
              git checkout -q -B main origin/main
              git diff --name-only --diff-filter=ACMR "$BASE" "$OURS" | xargs -r git checkout -q "$OURS" --
              for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
              git diff --cached --quiet || git commit -q -m "$MSG"
            fi
            if git push -q origin HEAD:main; then echo "gesichert"; exit 0; fi
            sleep $((i * 10))
          done
          echo "Sichern nach 4 Anläufen gescheitert"; exit 1
