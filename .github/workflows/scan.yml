name: Trend-Scan

on:
  schedule:
    # 07.10. (Lucio: "verlässlich jede Stunde um 13 nach"): GitHub löst geplante
    # Läufe sehr unzuverlässig aus — in den Tagen davor kamen von 16 stündlichen
    # Terminen nur 4-6 an, meist 30-70 min zu spät. Der HAUPTTAKT kommt deshalb
    # von außen: cron-job.org startet den Workflow jede Stunde um :13 deutscher
    # Zeit per API (workflow_dispatch mit quelle=uhr, siehe ANLEITUNG.md). Die
    # Einträge hier bleiben nur als Rückfallebene. Doppelte Läufe verhindert
    # scan.py: liegt der letzte Lauf weniger als MIN_ABSTAND_MIN (45) zurück,
    # bricht der neue nach Sekunden ab.
    # Winterzeit ab 25.10.: 05-20 UTC = 06-21 Uhr (Sommer ab 28.03.2027: wieder "13 4-19 * * *", Vorwärmen "17 21,1 * * *").
    - cron: "13 5-20 * * *"
    # 07.10. (Lucio): kein später Fr/Sa-Lauf mehr ("bleibe eh nie lange wach").
    # Vorwärm-Läufe (laden nachts die Teams des nächsten Tages, kein Bericht).
    - cron: "17 22,2 * * *"
  # 20.09.: Start per Push auf die Datei "scan_now" (Inhalt egal) — damit
  # ein Lauf auch ohne den "Run workflow"-Knopf ausgelöst werden kann
  # (z.B. von Claude aus, wenn der Zeitplan ausfällt).
  push:
    branches: [main]
    paths: ["scan_now"]
  workflow_dispatch:      # manueller Start über den "Run workflow"-Knopf
    inputs:
      quelle:
        description: "hand = Start von Hand (immer ausführen) · uhr = stündlicher Takt von cron-job.org (Mindestabstand gilt)"
        type: string
        default: "hand"
      bis:
        description: "Prüffenster verlängern: Stunde des NÄCHSTEN Tages, z.B. 12 = bis morgen 12 Uhr (leer = normal)"
        type: string
        default: ""
      datum:
        description: "nur für backtest: Tag als JJJJ-MM-TT (leer = gestern)"
        type: string
        default: ""
      modus:
        description: "scan = normaler Lauf · nachladen = Historien der Teams von heute/morgen neu laden · inventar = welche Märkte/Daten liefert die API pre-match? · abdeckung = welche Statistik-Felder gibt es je Liga (CSV)? · exoten = Paraden/Einwürfe/Abstöße/Freistöße nachladen · tore = Halbzeit-Tore nachladen · tordiagnose = Ereignis-Verlauf im Rohformat ansehen · schuesse = Schusszahlen von gestern roh ausgeben · backtest = einen vergangenen Tag nachrechnen"
        type: choice
        default: scan
        options: [scan, nachladen, inventar, abdeckung, exoten, tore, tordiagnose, schuesse, backtest]

# 21.09.: Sperre "nur ein Lauf gleichzeitig" ENTFERNT. GitHub hält bei
# concurrency nur EINEN wartenden Lauf — kommt ein dritter dazu, wird der
# wartende stillschweigend abgebrochen. Genau so sind geplante Läufe
# verschwunden, wenn nebenher ein Lauf von Hand angestoßen wurde. Der
# Commit-Schritt ist seit 17.09. konfliktfest (rebase -X theirs, 4 Anläufe),
# parallele Läufe sind damit unkritisch.

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # 19.09.: 300 -> 45. Ein hängender Lauf hat sonst 5 Stunden Minuten
    # verbrannt; ein normaler Lauf braucht 15–21 min. Manuelle Nachlade-Modi
    # (nachladen, exoten, tore …) bekommen 180 min.
    timeout-minutes: ${{ inputs.modus != '' && inputs.modus != 'scan' && 180 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan ausführen
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          # 17.09.: bet365-Katalog (Quotenvergleich) — liegt das Paket auf einem
          # anderen Konto, dessen Token als Secret BETSAPI_TOKEN_B365 eintragen;
          # sonst wird der Test-Token bzw. der Fußball-Token genommen.
          BETSAPI_TOKEN_B365: ${{ secrets.BETSAPI_TOKEN_B365 || secrets.BETSAPI_TOKEN_TRIAL || secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 15.10.: Zweitprüfung per Claude-Agent (agent.py) – ohne Secret passiert nichts
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          PYTHONUNBUFFERED: "1"
          BACKFILL: ${{ inputs.modus == 'nachladen' && '1' || '0' }}
          INVENTORY: ${{ inputs.modus == 'inventar' && '1' || '0' }}
          COVERAGE: ${{ inputs.modus == 'abdeckung' && '1' || '0' }}
          EXOTEN: ${{ inputs.modus == 'exoten' && '1' || '0' }}
          TORE: ${{ inputs.modus == 'tore' && '1' || '0' }}
          TOREDIAG: ${{ inputs.modus == 'tordiagnose' && '1' || '0' }}
          SHOTSCHECK: ${{ inputs.modus == 'schuesse' && '1' || '0' }}
          BACKTEST: ${{ inputs.modus == 'backtest' && '1' || '0' }}
          BACKTEST_TAG: ${{ inputs.datum }}
          SCAN_BIS: ${{ inputs.bis }}
          # 23.09.: Token-Check — ein Push mit "Tokencheck" in der Commit-Nachricht
          # testet alle hinterlegten Tokens und meldet nur OK/Fehler.
          TOKENCHECK: ${{ contains(github.event.head_commit.message, 'Tokencheck') && '1' || '0' }}
          BETSAPI_TOKEN_TRIAL_RAW: ${{ secrets.BETSAPI_TOKEN_TRIAL }}
          BETSAPI_TOKEN_B365_RAW: ${{ secrets.BETSAPI_TOKEN_B365 }}
          # FORCE=1 = Mindestabstand ignorieren: bei jedem Start von Hand und per
          # scan_now. Stundentakt (quelle=uhr) und Rückfall-Zeitplan: FORCE=0.
          # Mindestabstand zum letzten Lauf: Stundentakt 20 min, GitHub-Zeitplan
          # 75 min (springt nur ein, wenn eine Stunde wirklich ausgefallen ist).
          # 29.10.: 40 -> 20. Ein Handlauf um 12:47 hat den Stundenlauf 13:13 geschluckt
          # (26 min < 40) → Lucio 1,5 h ohne Scan. Ein Handlauf blockiert jetzt nur noch,
          # wenn er weniger als 20 min zurückliegt (dann sind die Quoten ohnehin frisch).
          MIN_ABSTAND_MIN: ${{ github.event_name == 'schedule' && '75' || '20' }}
          FORCE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.quelle != 'uhr')) && '1' || '0' }}
        run: python scan.py

      - name: Cache, Lauf-Gedächtnis und Protokoll sichern
        if: always()
        # 17.09.: Zwei Läufe, die dieselbe Tagesdatei schreiben, liefen beim "pull --rebase" in einen Konflikt, der
        # Rebase blieb halb fertig stehen ("not currently on a branch"), der
        # Push scheiterte — Ergebnis war da, wurde aber nicht gesichert.
        # Jetzt: bei Konflikten gewinnt die Fassung DIESES Laufs für die
        # Dateien, die er geschrieben hat; alles andere kommt von origin.
        # Dazu bis zu vier Anläufe, falls parallel ein anderer Lauf pusht.
        run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          MSG="Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git commit -q -m "$MSG"
          for i in 1 2 3 4; do
            OURS=$(git rev-parse HEAD)
            git fetch -q origin main
            if ! git rebase -q -X theirs origin/main; then
              git rebase --abort || true
              git checkout -q -B main origin/main
              git diff --name-only --diff-filter=ACMR "$BASE" "$OURS" | xargs -r git checkout -q "$OURS" --
              for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
              git diff --cached --quiet || git commit -q -m "$MSG"
            fi
            if git push -q origin HEAD:main; then echo "gesichert"; exit 0; fi
            sleep $((i * 10))
          done
          echo "Sichern nach 4 Anläufen gescheitert"; exit 1
