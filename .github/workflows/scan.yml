name: Trend-Scan

on:
  schedule:
    # Alle 2 Stunden, 04:17–18:17 UTC = 06:17–20:17 deutscher Sommerzeit.
    # Minute 17 statt 0: GitHub startet Cron-Jobs zur vollen Stunde oft mit
    # großer Verspätung (Warteschlange) — schräge Minuten laufen pünktlicher.
    # Hinweis: Im Winter (UTC+1) verschiebt sich das um eine Stunde;
    # bei Bedarf dann auf "17 5-19/2 * * *" ändern.
    # Der 18:17-UTC-Lauf (= 20:17 deutscher Zeit) ist der LETZTE des Tages und
    # deckt zugleich alle Anstöße bis 06:00 früh ab (Nachtspiele) — der frühere
    # Extra-Lauf um 21:11 entfällt (Lucio, 06.09.).
    - cron: "17 4-18/2 * * *"
    # Freitag + Samstag zusätzlich ein später Schlusslauf: 20:05 UTC =
    # 22:05 deutscher Sommerzeit (Lucio schafft es an diesen Tagen länger).
    # Prüffenster wie beim 20:17-Lauf, also bis 06:00 früh.
    # (Winter: "5 21 * * 5,6")
    - cron: "5 20 * * 5,6"
    # Vorwärm-Läufe 21:17/23:17/01:17/03:17 UTC = 23:17, 01:17, 03:17, 05:17
    # deutscher Sommerzeit: laden ab 23:17 die Spiele des NÄCHSTEN Tages
    # Stück für Stück in den Cache (kein Bericht), jeder hört am Stundenlimit
    # auf. So verteilt sich die Last über die Nacht statt auf den 06:17-Lauf.
    # (Winter: "17 22,0,2,4 * * *")
    - cron: "17 21,23,1,3 * * *"
  workflow_dispatch:      # manueller Start über den "Run workflow"-Knopf
    inputs:
      modus:
        description: "scan = normaler Lauf · nachladen = Historien der Teams von heute/morgen neu laden · inventar = welche Märkte/Daten liefert die API pre-match?"
        type: choice
        default: scan
        options: [scan, nachladen, inventar]

concurrency:
  group: trend-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan ausführen
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          BACKFILL: ${{ inputs.modus == 'nachladen' && '1' || '0' }}
          INVENTORY: ${{ inputs.modus == 'inventar' && '1' || '0' }}
        run: python scan.py

      - name: Cache, Lauf-Gedächtnis und Protokoll sichern
        if: always()
        run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          for d in cache runs state; do [ -d "$d" ] && git add "$d"; done; true
          git diff --cached --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main || true
          git push
