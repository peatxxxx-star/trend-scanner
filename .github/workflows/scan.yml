name: Trend-Scan

on:
  schedule:
    - cron: "0 4-20/2 * * *"   # alle 2h, 06–22 Uhr deutscher Sommerzeit
  workflow_dispatch: {}

concurrency:
  group: trend-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan ausführen
        env:
          BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: python scan.py

      - name: Cache und Lauf-Protokoll sichern
        if: always()
        run: |
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add cache/ runs/
          git diff --cached --quiet || git commit -m "Scan $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
