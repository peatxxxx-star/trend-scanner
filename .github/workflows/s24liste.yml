name: scores24-Liste

# 05.11.2026 (Lucio): scores24 auslesen (Spiele, Serien, Quoten) ohne BetsAPI.
# Claude pusht die Datei "s24_now"; der Lauf legt die Rohdaten als Artefakt ab.

on:
  push:
    branches: [main]
    paths: ["s24_now"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scores24 abrufen
        env:
          PYTHONUNBUFFERED: "1"
          S24_BIS: "20"
        run: python s24liste.py
      - name: Sichern
        if: always()
        run: |
          mkdir -p runs/s24 && cp out/*.json.gz runs/s24/ 2>/dev/null || true
          git config user.name "trend-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add runs/s24/ 2>/dev/null || true
          if git diff --cached --quiet; then echo "nichts zu sichern"; exit 0; fi
          git commit -q -m "scores24-Liste $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
